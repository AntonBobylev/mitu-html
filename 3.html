<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Форма обратной связи</title>
    </head>
    <body>
        <form action="#" method="POST">
            <h2>Обратная связь</h2>

            <div class="form-group">
                <label for="username">Имя пользователя: <span style="color: red;">*</span></label>
                <input type="text" id="username" name="username" required placeholder="Введите ваше имя">
            </div>

            <div class="form-group">
                <label for="email">Электронная почта: <span style="color: red;">*</span></label>
                <input type="email" id="email" name="email" required placeholder="example@domain.com">
            </div>

            <div class="form-group">
                <label for="country">Страна проживания:</label>
                <select id="country" name="country">
                    <option value="" disabled selected>Выберите страну</option>
                    <option value="ru">Россия</option>
                    <option value="by">Беларусь</option>
                    <option value="kz">Казахстан</option>
                </select>
            </div>

            <fieldset class="radio-group">
                <legend>Пол</legend>
                <div>
                    <input type="radio" id="gender-male" name="gender" value="male">
                    <label for="gender-male">Мужской</label>
                </div>
                <div>
                    <input type="radio" id="gender-female" name="gender" value="female">
                    <label for="gender-female">Женский</label>
                </div>
                <div>
                    <input type="radio" id="gender-other" name="gender" value="other">
                    <label for="gender-other">Другой</label>
                </div>
            </fieldset>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="agreement" name="agreement" required>
                <label for="agreement">Согласен с условиями обработки персональных данных <span style="color: red;">*</span></label>
            </div>

            <button type="submit">Отправить</button>
        </form>
    </body>
</html>
